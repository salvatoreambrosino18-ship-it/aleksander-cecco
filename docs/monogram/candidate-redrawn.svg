<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Aleksander Cecco">
<title>Aleksander Cecco</title>
<style>
  /* The AC monogram, redrawn from the signature's own letters (section 71):
     the full mark at 16px was a smudge, so the tab carries the two initials
     as centerline strokes - the A with its entry sweep and written lean, the
     C of Cecco as one open arc. Ink on the reader's light theme, paper on
     dark, exactly as the site's one shape in two polarities. */
  path { stroke: #0A0A0A; fill: none; stroke-linecap: round; stroke-width: 42; }
  @media (prefers-color-scheme: dark) { path { stroke: #FAFAF8; } }
</style>
<g transform="skewX(-8)" transform-origin="256 256">
<path d="M 30 310 C 100 268, 158 204, 214 58"/>
<path d="M 214 58 L 268 336"/>
<path d="M 104 252 C 158 238, 196 232, 252 226"/>
</g>
<path d="M 472 150 C 402 56, 282 94, 252 218 C 224 338, 302 452, 402 420 C 440 407, 464 380, 474 350"/>
</svg>
